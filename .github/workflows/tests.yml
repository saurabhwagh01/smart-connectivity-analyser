name: Smart Connectivity Analyser Tests

'on':
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-checks:
    name: JavaScript Syntax and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check js/script.js

      - name: Run connectivity score tests
        run: node --test tests/connectivity-score.test.js

  python-checks:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js for frontend test integration
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q tests

      - name: Check Python backend syntax
        run: python -m compileall -q backend
