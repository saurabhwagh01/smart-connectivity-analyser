name: Smart Connectivity Analyser Tests

'on':
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-checks:
    name: JavaScript Syntax and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check js/script.js
          node --check js/connectivity-score.js

      - name: Run JavaScript tests
        run: node --test tests/connectivity-score.test.js tests/session-statistics.test.js

  python-checks:
    name: Python Backend Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python backend syntax
        run: python -m compileall -q backend
